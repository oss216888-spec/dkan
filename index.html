<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعديل صور المنتجات بالذكاء الاصطناعي</title>
    <!-- استخدام Tailwind CSS للتصميم -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- استدعاء مكتبة fal.ai الرسمية للـ Frontend -->
    <script type="module">
        import * as fal from "https://cdn.jsdelivr.net/npm/@fal-ai/client@$0.4/dist/index.js";
        window.fal = fal;
    </script>
</head>
<body class="bg-gray-100 font-sans min-h-screen p-6 flex items-center justify-center">

    <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl p-8">
        <h1 class="text-2xl font-extrabold text-center text-gray-800 mb-6">🎨 تعديل صور المنتجات لمتجرك</h1>

        <!-- إدخال مفتاح الـ API -->
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">مفتاح الـ API (API Key):</label>
            <input type="password" id="apiKey" value="fal_sk_52651de318414938beecb244e54a48e:7b9fcc7957541fbe7205ea938e77d26b" 
                   class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                   placeholder="أدخل مفتاح fal.ai الخاص بك">
        </div>

        <!-- رفع الصورة -->
        <div class="mb-4">
            <label class="block text-gray-700 font-semibold mb-2">اختر صورة المنتج:</label>
            <input type="file" id="imageFile" accept="image/*" 
                   class="w-full px-3 py-2 border rounded-lg bg-gray-50 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100">
        </div>

        <!-- وصف التعديل -->
        <div class="mb-6">
            <label class="block text-gray-700 font-semibold mb-2">صف التعديل المطلوب (Prompt):</label>
            <textarea id="promptText" rows="3" 
                      class="w-full px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500" 
                      placeholder="مثال: ضع المنتج على طاولة رخامية فاخرة مع إضاءة دافئة"></textarea>
        </div>

        <!-- زر التنفيذ -->
        <button onclick="generateImage()" id="submitBtn" 
                class="w-full bg-indigo-600 text-white font-bold py-3 rounded-lg hover:bg-indigo-700 transition duration-200 shadow-md">
            توليد الصورة المعدلة 🚀
        </button>

        <!-- حالة التحميل -->
        <div id="loading" class="hidden text-center mt-6 text-indigo-600 font-semibold animate-pulse">
            ⏳ جاري معالجة الصورة بالذكاء الاصطناعي، يرجى الانتظار ثواني...
        </div>

        <!-- عرض النتيجة -->
        <div id="resultContainer" class="mt-6 hidden text-center">
            <h3 class="font-bold text-gray-700 mb-2">✨ الصورة الناتجة:</h3>
            <img id="resultImage" src="" alt="الصورة المعدلة" class="max-w-full rounded-lg shadow-lg mx-auto border mb-4">
            <a id="downloadBtn" href="" target="_blank" download="edited-product.jpg" 
               class="inline-block bg-green-600 text-white font-bold px-6 py-2 rounded-lg hover:bg-green-700 transition">
                تحميل الصورة
            </a>
        </div>
    </div>

    <script>
        async function generateImage() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const fileInput = document.getElementById('imageFile').files[0];
            const promptText = document.getElementById('promptText').value.trim();
            const loading = document.getElementById('loading');
            const resultContainer = document.getElementById('resultContainer');
            const resultImage = document.getElementById('resultImage');
            const downloadBtn = document.getElementById('downloadBtn');
            const submitBtn = document.getElementById('submitBtn');

            if (!apiKey) {
                alert('الرجاء إدخال مفتاح الـ API');
                return;
            }
            if (!fileInput) {
                alert('الرجاء اختيار صورة المنتج أولاً');
                return;
            }
            if (!promptText) {
                alert('الرجاء كتابة وصف التعديل المطلوب');
                return;
            }

            loading.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                // إعداد المفتاح للاتصال
                window.fal.config({ credentials: apiKey });

                // 1. رفع الصورة إلى سحابة fal للحصول على رابط مؤقت
                const imageUrl = await window.fal.storage.upload(fileInput);

                // 2. إرسال الطلب لنموذج المعالجة والتعديل (Flux Redux)
                const result = await window.fal.subscribe("fal-ai/flux-pro/v1.1/redux", {
                    input: {
                        image_url: imageUrl,
                        prompt: promptText,
                    },
                    logs: true,
                });

                // 3. جلب رابط الصورة المعدلة وعرضها
                const finalImageUrl = result.data.images[0].url;
                resultImage.src = finalImageUrl;
                downloadBtn.href = finalImageUrl;
                resultContainer.classList.remove('hidden');

            } catch (error) {
                console.error(error);
                alert('حدث خطأ أثناء المعالجة: ' + (error.message || 'تأكد من رصيد الحساب أو صحة المفتاح'));
            } finally {
                loading.classList.add('hidden');
                submitBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
